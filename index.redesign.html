<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Multi Poll Widget — Redesign Sandbox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>

<body>
  <div class="poll-wrapper" id="poll-widget">

    <div class="poll-card">
      <div class="poll-timer-overlay" style="width: 60%;"></div>
      <div class="title">WHICH GAME NEXT?</div>
      <div class="choices">
        <div class="choice">
          <div class="vote-key">1</div>
          <div class="choice-main">
            <div class="choice-label">
              <div class="choice-text">Choice 1</div>
              <div class="choice-right">
                <div class="votes">(12 votes)</div>
                <div class="percent">40%</div>
              </div>
            </div>
            <div class="gauge">
              <div class="gauge-fill choice-1" style="width: 40%;"></div>
            </div>
          </div>
        </div>

        <div class="choice">
          <div class="vote-key">2</div>
          <div class="choice-main">
            <div class="choice-label">
              <div class="choice-text">Choice 2</div>
              <div class="choice-right">
                <div class="votes">(8 votes)</div>
                <div class="percent">27%</div>
              </div>
            </div>
            <div class="gauge">
              <div class="gauge-fill choice-2" style="width: 27%;"></div>
            </div>
          </div>
        </div>

        <div class="choice">
          <div class="vote-key">3</div>
          <div class="choice-main">
            <div class="choice-label">
              <div class="choice-text">Choice 3</div>
              <div class="choice-right">
                <div class="votes">(5 votes)</div>
                <div class="percent">17%</div>
              </div>
            </div>
            <div class="gauge">
              <div class="gauge-fill choice-3" style="width: 17%;"></div>
            </div>
          </div>
        </div>

        <div class="choice">
          <div class="vote-key">4</div>
          <div class="choice-main">
            <div class="choice-label">
              <div class="choice-text">Choice 4</div>
              <div class="choice-right">
                <div class="votes">(3 votes)</div>
                <div class="percent">10%</div>
              </div>
            </div>
            <div class="gauge">
              <div class="gauge-fill choice-4" style="width: 10%;"></div>
            </div>
          </div>
        </div>

        <div class="choice">
          <div class="vote-key">5</div>
          <div class="choice-main">
            <div class="choice-label">
              <div class="choice-text">Choice 5</div>
              <div class="choice-right">
                <div class="votes">(2 votes)</div>
                <div class="percent">6%</div>
              </div>
            </div>
            <div class="gauge">
              <div class="gauge-fill choice-5" style="width: 6%;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="notifications"></div>
</body>

</html>

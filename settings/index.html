<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../.common/assets/images/favicon.ico">
  <title>MultiPoll Overlay Settings</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    #settingsCoreFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="settingsCoreFrame" title="Settings"></iframe>

  <script>
    (function () {
      const frame = document.getElementById('settingsCoreFrame');
      const currentDir = window.location.href.replace(/index\.html(?:\?.*)?$/, '');
      const rootDir = currentDir.replace(/settings\/$/, '');

      const bootConfig = {
        configUrl: currentDir + 'settings.json',
        hooksUrl: currentDir + 'settings.js',
        widgetUrl: rootDir + 'index.preview.html',
        page: {
          widgetTitle: 'MultiPoll Widget',
          storageKey: 'multipoll-settings',
        },
      };
      const sessionKey = 'settings-core:' + window.location.pathname;
      sessionStorage.setItem(sessionKey, JSON.stringify(bootConfig));
      frame.src = rootDir + '.common/core/settings/index.html?sessionKey=' + encodeURIComponent(sessionKey);

      // The core's copy-link button shares the same widgetUrl as the live preview iframe
      // (index.preview.html, so the preview renders without a live poll). Rewriting the
      // clipboard write here keeps the *copied* link pointing at the real overlay instead.
      frame.addEventListener('load', () => {
        const previewWindow = frame.contentWindow;
        const clipboard = previewWindow && previewWindow.navigator && previewWindow.navigator.clipboard;
        if (!clipboard || typeof clipboard.writeText !== 'function') return;

        const originalWriteText = clipboard.writeText.bind(clipboard);
        clipboard.writeText = (text) => {
          const shareText = typeof text === 'string' ? text.replace('index.preview.html', 'index.html') : text;
          return originalWriteText(shareText);
        };
      });
    })();
    
  </script>
</body>
</html>
